    <a class="skip" href="#main">본문 바로가기</a>

    <header class="site-header">
        <div class="wrap header-inner">
            <a class="logo" href="index.html">
                아랑슬
                <span>ARANG &amp; SEUL</span>
            </a>

            <button
                class="menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="navigation"
            >
                메뉴
                <span aria-hidden="true">☰</span>
            </button>

            <nav id="navigation" aria-label="주 메뉴">

            </p>
        </section>

        <section class="wrap collection">
            <div
                class="filter-bar"
                role="group"
                aria-label="캐릭터 필터"

                <button type="button" data-filter="all" aria-pressed="true">
                    전체
                </button>

                <button type="button" data-filter="arang" aria-pressed="false">
                    아랑
                </button>

                <button type="button" data-filter="seul" aria-pressed="false">
                    슬이
                </button>

                <button type="button" data-filter="both" aria-pressed="false">
                    함께
                </button>
            </div>

            <p id="result-count" class="count" aria-live="polite">
                전체 16개 작품
            </p>

                    type="button"
                    class="sticker"
                    data-category="arang"
                    data-zoom
                    aria-label="여봐라~ 확대 보기"
                >
                    <img
                        src="../image/illust/여봐라~.png"
                        alt="여봐라~"
                        class=""
                        loading="lazy"
                    >
                    <span>
                        <small>01</small>
                        여봐라~
                    </span>
                </button>

                <button
                    type="button"
                    class="sticker"
                    data-category="both"

        <section class="wrap section sheet-feature">
            <div>
                <p class="eyebrow">FULL COLLECTION</p>

                <h2>
                    한 장에 담은<br>
                    열여섯 가지 마음

                <p>
                    아랑과 슬이의 다양한 감정을 담은 전체 이모티콘 시트입니다.
                </p>
            </div>

            <button

                aria-label="이모티콘 전체 시트 확대 보기"

                <img
                    src="../image/illust/이모티콘 시트.png"
                    alt="아랑슬 이모티콘 전체 시트"

    <footer class="site-footer">

            <a class="logo" href="index.html">

    <dialog id="lightbox" aria-labelledby="lightbox-title">
        <button
